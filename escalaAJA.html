<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala de Servidores - AJA</title>
<style id="guarda-css">html{visibility:hidden}</style>
<noscript><meta http-equiv="refresh" content="0;url=index.html"></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%}
body{font:14px "Segoe UI",Arial,sans-serif;margin:0;padding:20px;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;color:#111;text-align:center;
  display:flex;justify-content:center;align-items:center;
  background-color:#e6ecf3;
  background-image:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),url('background.png');
  background-size:100% 100%;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
.painel{background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 10px 36px rgba(0,0,0,.7);padding:14px 18px;width:fit-content;max-width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
button{font:inherit;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:6px}
.bar input,.bar select{padding:6px 8px;border:1px solid #888;border-radius:3px;font:inherit}
.btn{padding:5px 14px;border:1px solid #888;background:#f2f2f2;border-radius:3px}
.btn:hover{background:#e6e6e6}
#st{color:#1d4e89;font-weight:600}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.dias{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dias button{border:1px solid #1d4e89;background:#fff;color:#1d4e89;border-radius:99px;padding:2px 12px;text-transform:capitalize}
.dias button.on{background:#1d4e89;color:#fff}
.dias button.zero b{color:#b00020}
.dias button.on.zero b{color:#ffd0d6}
.hint{margin:0 0 8px;color:#555;font-size:.88rem;min-height:1.2em}
.wrap{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
table{border-collapse:collapse;margin:0 auto;flex:none;width:auto;font-size:14px}
th,td{border:1px solid #222;padding:2px 10px;vertical-align:middle;white-space:nowrap;text-align:center}
th{background:#0b2545;color:#fff;font-weight:700;padding:5px 10px;border-color:#0b2545}
th.s{cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
th.s:hover{background:#13315c}
th.titulo{background:#1d4e89;border-color:#1d4e89;padding:10px 12px;cursor:default}
.t1{font-size:1.45rem;font-weight:700}
.t2{font-size:.95rem;font-weight:700;font-style:italic;letter-spacing:.03em;margin-top:4px}
tr.AJA td{background:#eaf3fc}
tr.ABT td{background:#fdf1dc}
tr.ed td{background:#fff9c4}
tbody tr:hover td{filter:brightness(.96)}
td:nth-child(2),td:nth-child(3){text-align:left}
td input,td select{font:inherit;border:1px solid #999;border-radius:3px;background:#fff;padding:3px 4px;text-align:center;width:auto}
td:nth-child(2) input,td:nth-child(3) input{text-align:left}
td select{width:100%;color:#555;margin-top:2px}
td input:focus,td select:focus{outline:2px solid #1d4e89}
.b{display:flex;justify-content:center;align-items:center;gap:6px;padding:1px 2px}
.b button{border:0;background:none;color:#b00020;font-size:1rem;line-height:1;padding:0 4px}
.rod{margin:6px 0 0;font-size:.85rem;color:#555}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.cx{background:#fff;border-radius:10px;padding:22px 24px;width:min(340px,90%);text-align:left;box-shadow:0 10px 36px rgba(0,0,0,.4)}
.cx .tt{margin:0 0 10px;font-weight:700;font-size:15px}
.cx label{display:block;margin:8px 0;font-weight:600}
.cx input{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:7px 8px;border:1px solid #888;border-radius:4px;font:inherit}
.cx .er{color:#b00020;min-height:1.2em;margin:6px 0}
.cx .ac{display:flex;justify-content:flex-end;gap:8px}
.btn.pri{background:#1d4e89;color:#fff;border-color:#1d4e89}
#menu{position:fixed;display:none;z-index:50;background:#fff;border:1px solid #999;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px;min-width:180px;text-align:left}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:4px}
#menu button:hover{background:#e8eef7}
#menu button.d{color:#b00020}
@page{size:A4 landscape;margin:10mm}
@media print{
  html,body{height:auto}
  body{display:block;padding:0;min-height:0;height:auto;overflow:visible;background:none!important}
  .painel{display:block;max-height:none;background:none;box-shadow:none;padding:0;width:auto}
  .bar,.dias,.hint,#menu,.ov{display:none!important}
  .wrap{overflow:visible;max-height:none}
  th.s{position:static}
  table{zoom:.85!important}
  tbody tr:hover td{filter:none}
}
</style>
</head>
<body>
<div class="painel">
<div class="bar">
  <a class="btn" href="painel.html">← Voltar</a>
  <select id="fag" title="Filtrar por agência"><option value="">Todas as agências</option><option value="ABT">ABT</option><option value="AJA">AJA</option></select>
  <button class="btn" id="pw" style="display:none" title="Somente o proprietário">🔑 Alterar senha</button>
  <button class="btn" id="xls">Salvar em planilha</button>
  <button class="btn" id="pdf">Salvar em PDF</button>
</div>
<div class="dias" id="dias"></div>
<p class="hint"><span id="ht"></span> <span id="st"></span></p>
<div class="wrap">
<table>
<thead>
<tr><th colspan="6" class="titulo"><div class="t1">Escala de Servidores</div><div class="t2">Pesquisas Econômicas Anuais - AJA</div></th></tr>
<tr><th class="s" data-c="ag" data-l="Agência">Agência</th><th class="s" data-c="nome" data-l="APM">APM</th><th class="s" data-c="email" data-l="e-mail">e-mail</th><th class="s" data-c="contato" data-l="Contato">Contato</th><th class="s" data-c="siape" data-l="SIAPE">SIAPE</th><th class="s" data-c="dias" data-l="Dia Agência">Dia Agência</th></tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>
<p class="rod" id="rod"></p>
</div>
<div id="menu"></div>

<script>
const AG="AJA";
const sb=supabase.createClient('https://jvjfpxrknggeodjgamyu.supabase.co','sb_publishable_yxHF_N1gjdGoHMEoM5GF2w_QVMzzMF0');
const sair=()=>location.replace("index.html");
const DIAS=["segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira"];
const uid=()=>Math.random().toString(36).slice(2);

let apms=[],editId=null,podeEditar=false,proprietario=false,senhaEdicao="",versao=null,meta={},usuario="",filtroDia="",filtroAg="",ord={c:"",d:1},fila=Promise.resolve();
const novos=new Set();
const $=id=>document.getElementById(id),tb=$("tb"),menu=$("menu");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=(arr,cur)=>arr.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("");
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const fone=v=>{const d=String(v||"").replace(/\D/g,"").slice(0,11);if(!d)return"";let t="("+d.slice(0,2);if(d.length>2)t+=") "+d.slice(2,7);if(d.length>7)t+="-"+d.slice(7);return t};
const sz=v=>Math.max(8,String(v||"").length+1);
const ordem=l=>[...l].sort((x,y)=>DIAS.indexOf(x)-DIAS.indexOf(y));
const st=t=>$("st").textContent=t;
const normaliza=(l,ag)=>(Array.isArray(l)?l:[]).map(a=>({id:a.id||uid(),ag,nome:a.nome||"",email:a.email||"",contato:fone(a.contato),siape:String(a.siape||""),dias:ordem(Array.isArray(a.dias)?a.dias:(a.dia?[a.dia]:[]))}));

/* Dados no Supabase */
async function carregar(){
  const{data,error}=await sb.from("escala_agencia").select("agencia,dados,atualizado_em,atualizado_por").in("agencia",["ABT","AJA"]);
  if(error){st("Erro ao carregar");return}
  apms=[];versao=null;meta={};
  (data||[]).forEach(r=>{
    apms.push(...normaliza(r.dados,r.agencia));
    if(r.agencia===AG){versao=r.atualizado_em;meta=r}
  });
  render();
}
async function _salvar(){
  if(!podeEditar)return false;
  st("Salvando…");
  const r=await sb.rpc("escala_salvar",{p_agencia:AG,p_dados:apms.filter(a=>a.ag===AG),p_versao:versao,p_senha:senhaEdicao});
  if(r.error){
    const m=r.error.message||"";
    if(m.includes("CONFLITO"))alert("Outra pessoa alterou a escala enquanto você editava. Vou recarregar a versão mais recente; refaça a sua alteração.");
    else if(m.includes("SENHA_INVALIDA")){podeEditar=false;senhaEdicao="";alert("A senha de edição foi alterada. Clique com o botão direito e informe a nova senha.")}
    else alert("Não foi possível salvar: "+m);
    editId=null;await carregar();st("");return false;
  }
  versao=r.data;meta={atualizado_em:r.data,atualizado_por:usuario};st("Salvo");setTimeout(()=>st(""),1500);return true;
}
const salvar=()=>fila=fila.then(_salvar);

/* Filtros, ordenação e tela */
function filtrados(comDia){
  return apms.filter(a=>a.id===editId||((!filtroAg||a.ag===filtroAg)&&(!comDia||!filtroDia||a.dias.includes(filtroDia))));
}
function ordenados(l){
  const c=ord.c||"ag",v=a=>c==="dias"?(a.dias.length?DIAS.indexOf(a.dias[0]):9):norm(a[c]);
  return [...l].sort((x,y)=>{const A=v(x),B=v(y);let r=A<B?-1:A>B?1:0;if(ord.c)r*=ord.d;return r||x.nome.localeCompare(y.nome,"pt")});
}
function quando(){
  if(!meta.atualizado_em)return"";
  const d=new Date(meta.atualizado_em);
  return`Atualizado em ${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`+(meta.atualizado_por?` por ${meta.atualizado_por}`:"");
}
function render(){
  const L=ordenados(filtrados(true));
  tb.innerHTML=L.length?L.map(a=>{
    const ed=a.id===editId,dl=DIAS.filter(d=>!a.dias.includes(d));
    const cell=(f,v)=>ed?`<input data-f="${f}" size="${sz(v)}" value="${esc(v)}">`:esc(v);
    const dias=a.dias.map(d=>`<div class="b"><span>${d}</span>${ed?`<button title="Remover dia" data-rmd="${d}">×</button>`:""}</div>`).join("");
    return`<tr class="${a.ag}${ed?" ed":""}" data-id="${a.id}">
<td>${esc(a.ag)}</td>
<td>${cell("nome",a.nome)}</td><td>${cell("email",a.email)}</td><td>${ed?`<input data-f="contato" inputmode="tel" maxlength="15" size="16" placeholder="(##) #####-####" value="${esc(a.contato)}">`:esc(a.contato)}</td><td>${cell("siape",a.siape)}</td>
<td>${dias}${ed&&dl.length?`<select data-f="addd"><option value="">+ adicionar dia</option>${opts(dl)}</select>`:""}</td></tr>`}).join("")
    :`<tr><td colspan="6">Nenhum servidor encontrado.</td></tr>`;
  const base=filtrados(false);
  $("dias").innerHTML=DIAS.map(d=>{const n=base.filter(a=>a.dias.includes(d)).length;
    return`<button data-d="${d}" class="${filtroDia===d?"on":""}${n?"":" zero"}" title="Filtrar por este dia">${d.split("-")[0]} <b>${n}</b></button>`}).join("");
  document.querySelectorAll("th.s").forEach(th=>th.textContent=th.dataset.l+(ord.c===th.dataset.c?(ord.d>0?" ▲":" ▼"):""));
  $("rod").textContent=quando();
  const a=apms.find(x=>x.id===editId);
  $("ht").textContent=a?`Editando ${a.nome||"novo servidor"}. Clique fora da linha ou pressione Esc para concluir.`
    :podeEditar?"Edição liberada. Clique com o botão direito do mouse para editar, excluir ou adicionar servidores."
    :"Tabela travada. Clique com o botão direito do mouse e informe a senha para editar.";
  ajusta();
}
/* Se a tabela ainda for mais alta que a tela, reduz a escala dela para caber sem rolar */
function ajusta(){
  const t=document.querySelector("table"),w=document.querySelector(".wrap");
  t.style.zoom=1;
  const h=t.offsetHeight,d=w.clientHeight;
  if(h>d+1)t.style.zoom=Math.max(.5,d/h*.995);
}
addEventListener("resize",ajusta);
$("fag").onchange=e=>{filtroAg=e.target.value;render()};
$("dias").onclick=e=>{const b=e.target.closest("button");if(!b)return;filtroDia=filtroDia===b.dataset.d?"":b.dataset.d;render()};
document.querySelector("thead").onclick=e=>{const c=e.target.dataset.c;if(!c)return;
  if(ord.c!==c)ord={c,d:1};else if(ord.d===1)ord.d=-1;else ord={c:"",d:1};render()};

/* Edição (só pelo botão direito, só para editores) */
async function endEdit(){
  if(!editId)return;
  const a=apms.find(x=>x.id===editId),id=editId;editId=null;
  if(a&&!a.nome&&!a.email&&!a.contato&&!a.siape){apms=apms.filter(x=>x!==a);if(!novos.has(id))await salvar()}
  novos.delete(id);render();
}
function abrir(id){editId=id;render();const i=tb.querySelector("tr.ed input[data-f=nome]");if(i)i.focus()}
const find=el=>apms.find(a=>a.id===el.closest("tr").dataset.id);
tb.addEventListener("input",e=>{const t=e.target;if(t.tagName!=="INPUT")return;if(t.dataset.f==="contato"){t.value=fone(t.value);return}t.size=sz(t.value)});
tb.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.target.blur();endEdit()}});
tb.addEventListener("change",async e=>{
  const f=e.target.dataset.f;if(!f)return;const a=find(e.target),v=e.target.value;
  if(f==="contato"){const d=v.replace(/\D/g,"");if(d.length&&d.length!==11){alert("Informe o telefone completo no formato (##) #####-####, somente números.");e.target.value=a.contato;return}a.contato=fone(v)}
  else if(f==="addd"){if(v&&!a.dias.includes(v))a.dias=ordem([...a.dias,v])}else a[f]=v.trim();
  if(await salvar())novos.delete(a.id);
  if(f==="addd")render();
});
tb.addEventListener("click",async e=>{
  const t=e.target;if(!(t instanceof HTMLButtonElement)||t.dataset.rmd===undefined)return;
  const a=find(t);a.dias=a.dias.filter(d=>d!==t.dataset.rmd);await salvar();render();
});
document.querySelector(".wrap").addEventListener("contextmenu",async e=>{
  e.preventDefault();
  let row=e.target.closest("tr[data-id]");
  const outra=row&&apms.find(a=>a.id===row.dataset.id);
  if(outra&&outra.ag!==AG){st("Linha da "+outra.ag+": edite em escala"+outra.ag+".html");setTimeout(()=>st(""),3000);return}
  const id=row?row.dataset.id:"",x=e.clientX,y=e.clientY;
  if(!podeEditar&&!await desbloquear())return;
  menu.innerHTML=(row?`<button data-act="edit" data-id="${id}">Editar servidor</button><button class="d" data-act="del" data-id="${id}">Excluir servidor</button>`:"")+`<button data-act="add">Adicionar APM</button><button data-act="lock">Bloquear edição</button>`;
  menu.style.display="block";
  menu.style.left=Math.max(4,Math.min(x,innerWidth-menu.offsetWidth-8))+"px";
  menu.style.top=Math.max(4,Math.min(y,innerHeight-menu.offsetHeight-8))+"px";
});
/* Senha de edição */
function modal(titulo,campos,aoConfirmar){
  return new Promise(res=>{
    const ov=document.createElement("div");ov.className="ov";
    ov.innerHTML=`<div class="cx" role="dialog" aria-modal="true"><p class="tt">${esc(titulo)}</p>${campos.map(c=>`<label>${esc(c)}<input type="password" autocomplete="new-password"></label>`).join("")}<p class="er"></p><div class="ac"><button class="btn" data-x="0">Cancelar</button><button class="btn pri" data-x="1">Confirmar</button></div></div>`;
    document.body.appendChild(ov);
    const ins=[...ov.querySelectorAll("input")],er=ov.querySelector(".er");let ocupado=false;
    const fechar=v=>{ov.remove();res(v)};
    const ok=async()=>{if(ocupado)return;ocupado=true;er.textContent="";const msg=await aoConfirmar(ins.map(i=>i.value));ocupado=false;if(msg)er.textContent=msg;else fechar(true)};
    ov.addEventListener("click",e=>{e.stopPropagation();const b=e.target.closest("button");if(b){if(b.dataset.x==="1")ok();else fechar(false)}else if(e.target===ov)fechar(false)});
    ov.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();fechar(false)}else if(e.key==="Enter"&&e.target.tagName==="INPUT")ok()});
    ins[0].focus();
  });
}
async function desbloquear(){
  const ok=await modal("Digite a senha para editar a escala",["Senha"],async([s])=>{
    if(!s)return"Informe a senha.";
    const{data,error}=await sb.rpc("escala_verificar",{p_agencia:AG,p_senha:s});
    if(error)return"Erro ao verificar a senha: "+error.message;
    if(data!==true)return"Senha incorreta.";
    senhaEdicao=s;return"";
  });
  if(ok){podeEditar=true;render()}
  return ok;
}
$("pw").onclick=async()=>{
  await endEdit();
  const ok=await modal("Alterar a senha de edição ("+AG+")",["Nova senha","Repita a nova senha"],async([a,b])=>{
    if(a.length<4)return"A senha deve ter pelo menos 4 caracteres.";
    if(a!==b)return"As senhas não conferem.";
    const{error}=await sb.rpc("escala_trocar_senha",{p_agencia:AG,p_nova:a});
    if(error)return error.message.includes("SEM_PERMISSAO")?"Somente o proprietário pode alterar a senha.":"Não foi possível alterar: "+error.message;
    if(podeEditar)senhaEdicao=a;return"";
  });
  if(ok)alert("Senha alterada. Informe a nova senha a quem for editar a escala.");
};
menu.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;menu.style.display="none";
  if(act==="lock"){await endEdit();podeEditar=false;senhaEdicao="";render();return}
  await endEdit();await carregar();
  if(act==="edit"){if(apms.some(x=>x.id===id))abrir(id)}
  else if(act==="del"){const a=apms.find(x=>x.id===id);
    if(a&&confirm("Excluir "+(a.nome||"este servidor")+" da escala?")){apms=apms.filter(x=>x!==a);await salvar();render()}}
  else if(act==="add"){const n={id:uid(),ag:AG,nome:"",email:"",contato:"",siape:"",dias:[]};apms.push(n);novos.add(n.id);abrir(n.id)}
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#menu"))menu.style.display="none";
  if(editId&&!e.target.closest("tr.ed")&&!e.target.closest("#menu"))endEdit();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){menu.style.display="none";endEdit()}});
addEventListener("scroll",()=>menu.style.display="none",true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editId)carregar()});

/* PDF e planilha */
$("pdf").onclick=async()=>{await endEdit();window.print()};
function baixar(conteudo,tipo,nome){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;a.click();URL.revokeObjectURL(a.href)}
$("xls").onclick=async()=>{
  await endEdit();
  const cor={AJA:"#EAF3FC",ABT:"#FDF1DC"},br=l=>l.map(esc).join('<br style="mso-data-placement:same-cell">');
  const rows=ordenados(filtrados(true)).map(a=>{const s=`style="background:${cor[a.ag]}"`;
    return`<tr><td ${s}>${esc(a.ag)}</td><td ${s}>${esc(a.nome)}</td><td ${s}>${esc(a.email)}</td><td ${s}>${esc(a.contato)}</td><td ${s}>${esc(a.siape)}</td><td ${s}>${br(a.dias)}</td></tr>`}).join("");
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>td,th{border:.5pt solid #222;text-align:center;vertical-align:middle;mso-number-format:"\\@"}</style></head><body><table>
<tr><th colspan="6" style="background:#1d4e89;color:#fff;font-size:18pt;height:40pt">Escala de Servidores</th></tr>
<tr><th colspan="6" style="background:#1d4e89;color:#fff;letter-spacing:1pt;font-style:italic;font-weight:bold">Pesquisas Econômicas Anuais - AJA</th></tr>
<tr>${["Agência","APM","e-mail","Contato","SIAPE","Dia Agência"].map(h=>`<th style="background:#0b2545;color:#fff">${h}</th>`).join("")}</tr>${rows}
<tr><td colspan="6" style="border:0;text-align:right;font-size:9pt">${esc(quando())}</td></tr></table></body></html>`;
  baixar("\ufeff"+html,"application/vnd.ms-excel;charset=utf-8","escala-servidores-AJA.xls");
};

/* Início: login obrigatório (sem login, volta para o index.html e a página nunca é exibida) */
addEventListener("pageshow",e=>{if(e.persisted)location.reload()});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")sair()});
(async()=>{
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session)return sair();
    const{data:p}=await sb.from("perfis").select("aprovado").eq("id",session.user.id).maybeSingle();
    if(!p||p.aprovado!==true)return sair();
    usuario=session.user.email||"";
    const{data:ed}=await sb.from("escala_editores").select("email").maybeSingle();
    proprietario=!!ed;$("pw").style.display=proprietario?"":"none";
    await carregar();
    const g=$("guarda-css");if(g)g.remove();
    render();
  }catch(e){sair()}
})();
</script>
