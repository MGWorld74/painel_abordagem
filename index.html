<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('inicial.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 320px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .links a {
            color: #007bff;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .msg {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .msg-erro { color: #d9534f; }
        .msg-sucesso { color: #28a745; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>

<div class="login-card">

    <!-- SESSÃO DE LOGIN -->
    <div id="sec-login" class="form-section active">
        <h2>Login</h2>
        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label for="usuario">Utilizador</label>
                <input type="text" id="usuario" required>
            </div>
            <div class="form-group">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
            <div id="erro-login" class="msg msg-erro">Utilizador ou palavra-passe incorretos!</div>
        </form>
        <div class="links">
            <a href="#" onclick="mostrarSessao('sec-solicitar')">Não tem conta? Solicite acesso</a>
        </div>
    </div>

    <!-- SESSÃO DE SOLICITAÇÃO DE ACESSO -->
    <div id="sec-solicitar" class="form-section">
        <h2>Solicitar Acesso</h2>
        <form id="form-solicitacao" onsubmit="enviarSolicitacao(event)">
            <div class="form-group">
                <label for="sol-nome">Nome Completo</label>
                <input type="text" name="nome" id="sol-nome" required>
            </div>
            <div class="form-group">
                <label for="sol-email">E-mail para resposta</label>
                <input type="email" name="email" id="sol-email" required>
            </div>
            <div class="form-group">
                <label for="sol-motivo">Motivo / Empresa</label>
                <input type="text" name="motivo" id="sol-motivo" placeholder="Ex: Acesso ao setor X" required>
            </div>
            <button type="submit" id="btn-solicitar" class="btn-submit">Enviar Pedido</button>
            <div id="msg-sol" class="msg"></div>
        </form>
        <div class="links">
            <a href="#" onclick="mostrarSessao('sec-login')">Voltar ao Login</a>
        </div>
    </div>

</div>

<script>
    // LISTA DE UTILIZADORES APROVADOS POR SI
    // Adicione os utilizadores aprovados nesta lista:
    const usuariosAprovados = {
        "admin": "1234",
        "joao": "senha2026"
    };

    // Alternar visibilidade entre Login e Solicitação
    function mostrarSessao(idSessao) {
        document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.msg').forEach(el => el.style.display = 'none');
        document.getElementById(idSessao).classList.add('active');
    }

    // Processar Login
    function fazerLogin(event) {
        event.preventDefault();
        const user = document.getElementById('usuario').value.trim();
        const pass = document.getElementById('senha').value;
        const erro = document.getElementById('erro-login');

        if (usuariosAprovados[user] && usuariosAprovados[user] === pass) {
            window.location.href = "painel.html";
        } else {
            erro.style.display = 'block';
        }
    }

    // Enviar Solicitação para o seu E-mail via Formspree
    async function enviarSolicitacao(event) {
        event.preventDefault();
        const form = document.getElementById('form-solicitacao');
        const btn = document.getElementById('btn-solicitar');
        const msg = document.getElementById('msg-sol');

        btn.innerText = "A enviar...";
        btn.disabled = true;

        // SUBSTITUA O LINK ABAIXO PELO SEU LINK DO FORMSPREE:
        const endpointFormspree = 'https://formspree.io/f/xnpnrlke';

        try {
            const response = await fetch(endpointFormspree, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            });

            if (response.ok) {
                msg.className = 'msg msg-sucesso';
                msg.innerText = 'Solicitação enviada com sucesso! Aguarde a aprovação por e-mail.';
                msg.style.display = 'block';
                form.reset();
            } else {
                throw new Error('Erro ao enviar');
            }
        } catch (error) {
            msg.className = 'msg msg-erro';
            msg.innerText = 'Erro ao enviar o pedido. Tente novamente.';
            msg.style.display = 'block';
        } finally {
            btn.innerText = "Enviar Pedido";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
