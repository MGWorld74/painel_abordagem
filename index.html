<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('inicial.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 320px;
            max-width: 92vw;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .dica {
            display: block;
            margin-top: 4px;
            color: #888;
            font-size: 12px;
            line-height: 1.3;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: default;
        }
        .msg {
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .aviso-cadastro {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f1f6fc;
            border-left: 3px solid #007bff;
            border-radius: 4px;
            color: #444;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
        }
        .aviso-cadastro a {
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
            word-break: break-all;
        }
        .aviso-cadastro a:hover {
            text-decoration: underline;
        }
        .msg-erro { color: #d9534f; }
        .msg-sucesso { color: #28a745; }
        .msg-aviso { color: #b7791f; }
    </style>
</head>
<body>

<div class="login-card">

    <!-- FORMULÁRIO DE LOGIN -->
    <h2>Login</h2>
    <form onsubmit="fazerLogin(event)">
        <div class="form-group">
            <label for="email">E-mail institucional</label>
            <input type="email" id="email" placeholder="nome.sobrenome@ibge.gov.br" autocomplete="username" required>
            <span class="dica">Use o seu e-mail @ibge.gov.br</span>
        </div>
        <div class="form-group">
            <label for="senha">Palavra-passe</label>
            <input type="password" id="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login" class="btn-submit">Entrar</button>
        <div id="msg-login" class="msg"></div>
    </form>
    <div id="aviso-cadastro" class="aviso-cadastro">
        Solicite o seu cadastro pelo e-mail
        <a href="mailto:maury.goncalves@ibge.gov.br?subject=Solicitação de cadastro">maury.goncalves@ibge.gov.br</a>.
    </div>

</div>

<script>
    // =========================================================================
    // CONFIGURAÇÃO DO SUPABASE
    // =========================================================================
    const SUPABASE_URL = 'https://jvjfpxrknggeodjgamyu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yxHF_N1gjdGoHMEoM5GF2w_QVMzzMF0';

    // Domínio de e-mail aceito (somente IBGE)
    const DOMINIO_PERMITIDO = '@ibge.gov.br';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mostrar mensagem (tipo: 'erro' | 'sucesso' | 'aviso')
    function mostrarMsg(el, tipo, texto) {
        el.className = 'msg msg-' + tipo;
        el.innerText = texto;
        el.style.display = 'block';
    }

    // Consulta na tabela "perfis" se a conta foi aprovada pelo administrador.
    // Retorna true (aprovada), false (pendente) ou null (erro na consulta).
    async function contaAprovada(userId) {
        const { data, error } = await _supabase
            .from('perfis')
            .select('aprovado')
            .eq('id', userId)
            .maybeSingle();
        if (error) return null;
        return data ? data.aprovado === true : false;
    }

    // Se já existe sessão de uma conta aprovada, segue direto para o painel
    (async function verificarSessaoExistente() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session && (await contaAprovada(session.user.id)) === true) {
            window.location.replace('painel.html');
        }
    })();

    // Login: só entra no painel quem tiver a conta aprovada
    async function fazerLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('senha').value;
        const msg = document.getElementById('msg-login');
        const btn = document.getElementById('btn-login');
        const avisoCadastro = document.getElementById('aviso-cadastro');

        msg.style.display = 'none';
        avisoCadastro.style.display = 'none';

        // Só aceita e-mail do domínio do IBGE
        if (!email.endsWith(DOMINIO_PERMITIDO)) {
            mostrarMsg(msg, 'erro', 'Use o seu e-mail institucional (' + DOMINIO_PERMITIDO + ').');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'A verificar...';

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

        if (error) {
            if (/not confirmed/i.test(error.message)) {
                mostrarMsg(msg, 'aviso', 'Confirme o seu e-mail antes de entrar.');
            } else {
                mostrarMsg(msg, 'erro', 'E-mail ou palavra-passe incorretos.');
                avisoCadastro.style.display = 'block';
            }
        } else {
            const aprovada = await contaAprovada(data.user.id);

            if (aprovada === true) {
                window.location.href = 'painel.html';
                return;
            }

            await _supabase.auth.signOut();
            if (aprovada === false) {
                mostrarMsg(msg, 'aviso', 'O seu acesso ainda não foi liberado pelo administrador.');
                avisoCadastro.style.display = 'block';
            } else {
                mostrarMsg(msg, 'erro', 'Não foi possível verificar a sua conta. Tente novamente.');
            }
        }

        btn.disabled = false;
        btn.innerText = 'Entrar';
    }
</script>

</body>
</html>
